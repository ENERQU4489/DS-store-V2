name: Build NDS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NDS Dev
        run: |
          # W niektorych obrazach trzeba recznie doinstalowac biblioteki
          sudo dkp-pacman -Syyu --noconfirm nds-dev

      - name: Compile NDS
        working-directory: ./client
        run: |
          source /etc/profile.d/devkitpro.sh
          make

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NDSStore-Binary
          path: client/NDSStore.nds
