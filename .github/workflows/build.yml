name: Build NDS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix permissions
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - name: Debug and Compile
        working-directory: ./client
        run: |
          echo "--- SZUKAM REGUŁ ---"
          find /opt/devkitpro -name "nds_rules"
          echo "--- ZMIENNE ---"
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$PATH:$DEVKITARM/bin
          echo "DEVKITPRO: $DEVKITPRO"
          echo "DEVKITARM: $DEVKITARM"
          
          # Proba kompilacji z wstrzyknieciem poprawnej sciezki jesli find cos znajdzie
          RULES_PATH=$(find /opt/devkitpro -name "nds_rules")
          if [ -f "$RULES_PATH" ]; then
            echo "Znaleziono reguly w: $RULES_PATH"
            # Nadpisujemy sciezke w Makefile "w locie"
            sed -i "s|include.*nds_rules|include $RULES_PATH|g" Makefile
          fi
          
          make
